<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件上传与下载</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      min-height: 100vh;
    }
    .container {
      background: #fff;
      border-radius: 12px;
      padding: 40px;
      width: 600px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h1 { text-align: center; color: #333; margin-bottom: 30px; font-size: 24px; }
    h2 { color: #333; font-size: 18px; margin-bottom: 16px; }
    .section { margin-bottom: 36px; }
    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #4a90d9;
      background: #f0f7ff;
    }
    .drop-zone p { color: #888; margin-top: 8px; }
    .drop-zone .icon { font-size: 40px; }
    #file-input { display: none; }
    .file-list { margin-top: 20px; }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #f8f9fa;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .file-item .size { color: #999; }
    .btn-upload {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-upload:hover { background: #357abd; }
    .btn-upload:disabled { background: #ccc; cursor: not-allowed; }
    .progress {
      margin-top: 16px;
      height: 6px;
      background: #e9ecef;
      border-radius: 3px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      background: #4a90d9;
      width: 0%;
      transition: width 0.3s;
    }
    .result {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    .result.success { background: #d4edda; color: #155724; display: block; }
    .result.error { background: #f8d7da; color: #721c24; display: block; }
    .server-files { list-style: none; }
    .server-file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #f8f9fa;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 14px;
    }
    .server-file-item .file-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
      min-width: 0;
    }
    .server-file-item .file-name {
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .server-file-item .file-meta { color: #999; font-size: 12px; }
    .server-file-item .actions { display: flex; gap: 8px; margin-left: 12px; }
    .btn-icon {
      padding: 6px 12px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-download { background: #4a90d9; color: #fff; }
    .btn-download:hover { background: #357abd; }
    .btn-delete { background: #dc3545; color: #fff; }
    .btn-delete:hover { background: #c82333; }
    .empty-tip { color: #999; text-align: center; padding: 20px; font-size: 14px; }
    .btn-refresh {
      float: right;
      padding: 4px 12px;
      background: #6c757d;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-refresh:hover { background: #5a6268; }
  </style>
</head>
<body>
  <div class="container">
    <div class="section">
      <h1>文件上传与下载</h1>
      <div class="drop-zone" id="drop-zone">
        <div class="icon">📁</div>
        <p>点击选择文件或拖拽到此处</p>
        <input type="file" id="file-input" multiple>
      </div>
      <div class="file-list" id="file-list"></div>
      <button class="btn-upload" id="btn-upload" disabled>上传文件</button>
      <div class="progress" id="progress"><div class="progress-bar" id="progress-bar"></div></div>
      <div class="result" id="result"></div>
    </div>

    <div class="section">
      <h2>已上传文件 <button class="btn-refresh" id="btn-refresh">刷新</button></h2>
      <div id="server-files">
        <div class="empty-tip">加载中...</div>
      </div>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileList = document.getElementById('file-list');
    const btnUpload = document.getElementById('btn-upload');
    const progress = document.getElementById('progress');
    const progressBar = document.getElementById('progress-bar');
    const result = document.getElementById('result');
    const serverFiles = document.getElementById('server-files');
    const btnRefresh = document.getElementById('btn-refresh');

    let selectedFiles = [];

    dropZone.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', () => handleFiles(fileInput.files));

    function handleFiles(files) {
      selectedFiles = [...selectedFiles, ...files];
      renderFileList();
    }

    function renderFileList() {
      fileList.innerHTML = selectedFiles.map((f, i) =>
        `<div class="file-item">
          <span>${f.name}</span>
          <span class="size">${formatSize(f.size)}</span>
        </div>`
      ).join('');
      btnUpload.disabled = selectedFiles.length === 0;
    }

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
      return (bytes / 1073741824).toFixed(2) + ' GB';
    }

    btnUpload.addEventListener('click', async () => {
      if (selectedFiles.length === 0) return;

      const formData = new FormData();
      selectedFiles.forEach(f => formData.append('files', f));

      btnUpload.disabled = true;
      progress.style.display = 'block';
      result.className = 'result';
      result.style.display = 'none';

      const xhr = new XMLHttpRequest();
      xhr.upload.addEventListener('progress', e => {
        if (e.lengthComputable) {
          progressBar.style.width = (e.loaded / e.total * 100) + '%';
        }
      });

      xhr.addEventListener('load', () => {
        const res = JSON.parse(xhr.responseText);
        if (res.success) {
          result.className = 'result success';
          result.textContent = `上传成功！共 ${res.files.length} 个文件`;
          selectedFiles = [];
          renderFileList();
          loadServerFiles();
        } else {
          result.className = 'result error';
          result.textContent = res.message || '上传失败';
        }
        result.style.display = 'block';
        btnUpload.disabled = false;
      });

      xhr.addEventListener('error', () => {
        result.className = 'result error';
        result.textContent = '网络错误，上传失败';
        result.style.display = 'block';
        btnUpload.disabled = false;
      });

      xhr.open('POST', '/upload');
      xhr.send(formData);
    });

    async function loadServerFiles() {
      try {
        const res = await fetch('/files');
        const data = await res.json();
        if (data.success && data.files.length > 0) {
          serverFiles.innerHTML = data.files
            .sort((a, b) => b.time - a.time)
            .map(f => {
              const name = f.name.replace(/^\d+-\d+-/, '');
              const date = new Date(f.time).toLocaleString('zh-CN');
              return `<li class="server-file-item">
                <div class="file-info">
                  <span class="file-name" title="${name}">${name}</span>
                  <span class="file-meta">${formatSize(f.size)} · ${date}</span>
                </div>
                <div class="actions">
                  <button class="btn-icon btn-download" data-file="${f.name}">下载</button>
                  <button class="btn-icon btn-delete" data-file="${f.name}">删除</button>
                </div>
              </li>`;
            }).join('');

          serverFiles.querySelectorAll('.btn-download').forEach(btn => {
            btn.addEventListener('click', () => {
              window.location.href = `/download/${encodeURIComponent(btn.dataset.file)}`;
            });
          });

          serverFiles.querySelectorAll('.btn-delete').forEach(btn => {
            btn.addEventListener('click', async () => {
              if (!confirm('确定删除该文件？')) return;
              const res = await fetch(`/files/${encodeURIComponent(btn.dataset.file)}`, { method: 'DELETE' });
              const data = await res.json();
              if (data.success) {
                loadServerFiles();
              } else {
                alert(data.message || '删除失败');
              }
            });
          });
        } else {
          serverFiles.innerHTML = '<div class="empty-tip">暂无文件</div>';
        }
      } catch (e) {
        serverFiles.innerHTML = '<div class="empty-tip">加载失败</div>';
      }
    }

    btnRefresh.addEventListener('click', loadServerFiles);

    loadServerFiles();
  </script>
</body>
</html>
